services:
  - type: web
    name: truthlens-backend
    runtime: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
    
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value:
      - key: CORS_ORIGINS
        value: https://truthlens-frontend.onrender.com
      - key: ENVIRONMENT
        value: production
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  - type: web
    name: truthlens-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: 
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

